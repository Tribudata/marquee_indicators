name: Actualizar indicadores

on:
  schedule:
    # GitHub Actions usa UTC. Bogotá = UTC-5.
    # Esto corre cada hora, de 7am a 6pm hora Colombia, lunes a viernes.
    - cron: "0 12-23 * * 1-5"
  workflow_dispatch:        # botón para correrlo a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para que el bot pueda hacer commit

concurrency:                # evita dos corridas pisándose
  group: indicadores
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Consultar fuentes
        run: python scripts/actualizar_indicadores.py

      - name: Publicar si algo cambió
        run: |
          git config user.name  "bot-indicadores"
          git config user.email "actions@github.com"
          git add data/indicadores.json
          if git diff --staged --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Indicadores $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
